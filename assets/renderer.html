<canvas id="c" width="1080" height="1920"></canvas><script src="data.js"></script><script>
const c=document.getElementById('c'),g=c.getContext('2d'),P=DATA.project,T=DATA.timeline;
const AM='#f0a640',TE='#5cc2c9',IV='#f3eee2',MU='#9bb3bc',RD='#ff7a59',CU='#d69458';

const IM={};async function ready(){await document.fonts.ready;await Promise.all(Object.entries(DATA.images).map(([id,url])=>new Promise((ok,bad)=>{let im=new Image();im.onload=()=>{IM[id]=im;ok()};im.onerror=bad;im.src=url})));}
function rr(x,y,w,h,r=12){g.beginPath();g.roundRect(x,y,w,h,r)}
function text(s,x,y,size=32,col=IV,font=SERIF,weight=600,align='center'){g.font=`${weight} ${size}px ${font}`;g.fillStyle=col;g.textAlign=align;g.textBaseline='middle';g.fillText(s,x,y)}
function fit(s,x,y,size,col=IV,max=610,min=24,font=SERIF){g.font=`600 ${size}px ${font}`;while(g.measureText(s).width>max&&size>min){size--;g.font=`600 ${size}px ${font}`}text(s,x,y,size,col,font)}
function panel(x,y,w,h,border='rgba(92,194,201,.3)',fill='rgba(6,18,26,.82)',r=16){rr(x,y,w,h,r);g.fillStyle=fill;g.fill();g.strokeStyle=border;g.lineWidth=1.5;g.stroke()}
function line(x,y,x2,y2,col=TE,width=2){g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.strokeStyle=col;g.lineWidth=width;g.stroke()}
function alpha(a,fn){g.save();g.globalAlpha*=cl(a);fn();g.restore()}
function pill(s,x,y,w=300,col=AM){panel(x-w/2,y-27,w,54,col,'rgba(8,24,34,.92)',27);fit(s,x,y,26,col,w-30,20,SANS)}
function arrow(x,y,x2,y2,t,col=TE){g.setLineDash([5,7]);line(x,y,x2,y2,col);g.setLineDash([]);let a=Math.atan2(y2-y,x2-x);line(x2,y2,x2-9*Math.cos(a-.5),y2-9*Math.sin(a-.5),col);line(x2,y2,x2-9*Math.cos(a+.5),y2-9*Math.sin(a+.5),col);let u=(t*.5)%1;g.fillStyle=AM;g.beginPath();g.arc(x+(x2-x)*u,y+(y2-y)*u,3,0,7);g.fill()}
function bg(t){let a=g.createLinearGradient(0,0,0,1280);a.addColorStop(0,'#0a1c29');a.addColorStop(1,'#06121a');g.fillStyle=a;g.fillRect(0,0,720,1280);let r=g.createRadialGradient(360,690,0,360,690,680);r.addColorStop(0,'rgba(240,166,64,.1)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,720,1280);for(let i=0;i<45;i++){g.fillStyle=`rgba(255,220,160,${.04+.1*rnd(i+9)})`;g.beginPath();g.arc((rnd(i)*720+t*6)%720,((rnd(i+50)*1280-t*5)%1280+1280)%1280,1+rnd(i+2)*1.6,0,7);g.fill()}}
function identity(){panel(48,70,624,66,'rgba(240,166,64,.8)','rgba(240,166,64,.09)',33);fit(P.identity.institution+' · '+P.identity.patent_type,360,103,32,AM,575,25,SANS);fit(P.tagline,360,162,21,MU,610,18,SANS)}
function heading(s){fit(s.headline[0],360,235,46,IV,620,32);fit(s.headline[1]||'',360,299,40,AM,620,28)}
function note(s){fit(s||'原理示意',360,997,18,'rgba(155,179,188,.7)',620,16,SANS)}
function caption(s,t){let cp=s.captions.find(x=>t>=x.start&&t<x.until);if(!cp)return;let p=0,count=0,n=cp.words.reduce((a,w)=>a+w.text.length,0);for(let w of cp.words){if(t>=w.end)count+=w.text.length;else if(t>=w.start)count+=w.text.length*cl((t-w.start)/(w.end-w.start))}p=n?(t>=cp.end?1:count/n):1;let rows=wrap(cp.text,590,32),widths=rows.map(r=>measure(r,32)),top=rows.length===1?1070:1047,max=Math.max(...widths),total=widths.reduce((a,v)=>a+v,0);alpha(sm(t,cp.start-.02,cp.start+.12),()=>{panel(360-max/2-22,top-26,max+44,rows.length*48+4,'transparent','rgba(8,18,26,.78)',10);let traversed=0;rows.forEach((r,j)=>{let x=360-widths[j]/2,y=top+j*48;text(r,x,y,32,'rgba(243,238,226,.62)',SERIF,600,'left');g.save();g.beginPath();g.rect(x,y-24,cl(total*p-traversed,0,widths[j]),48);g.clip();text(r,x,y,32,AM,SERIF,600,'left');g.restore();traversed+=widths[j]})})}
function measure(s,size){g.font=`600 ${size}px ${SERIF}`;return g.measureText(s).width}
function wrap(s,max,size){let rows=[],row='';for(let ch of s){if(measure(row+ch,size)>max){rows.push(row);row=ch}else row+=ch}if(row)rows.push(row);return rows}
function flow(v,t){let a=v.items,n=a.length,gap=Math.min(142,480/Math.max(1,n-1));a.forEach((s,i)=>{let y=411+i*gap;alpha(sm(t,i*.65,i*.65+.6),()=>{panel(115,y,490,84,i===n-1?AM:TE);fit(s,360,y+42,31,i===n-1?AM:IV,455,23);if(i<n-1)arrow(360,y+88,360,y+gap-9,t)})})}
function cards(v,t){let n=v.items.length,h=Math.min(155,(550-13*(n-1))/n);v.items.forEach((s,i)=>alpha(sm(t,i*.6,i*.6+.5),()=>{panel(65,401+i*(h+13),590,h, i===n-1?AM:TE);fit(s,360,401+i*(h+13)+h/2,34,i===n-1?AM:IV,550,23)}));}
function compare(v,t){let a=v.items;panel(55,400,610,210,TE);text(v.labels?.[0]||'现有方式',360,441,25,MU,SANS);fit(a[0],360,524,35,IV,565,24);arrow(360,640,360,694,t);panel(55,724,610,210,AM,'rgba(240,166,64,.08)');text(v.labels?.[1]||'本项方案',360,765,25,MU,SANS);fit(a[1]||'',360,848,35,AM,565,24)}
function droplet(x,y,r,col=TE,sy=1){g.save();g.translate(x,y);g.scale(1,sy);let gr=g.createRadialGradient(-r*.35,-r*.4,1,0,0,r);gr.addColorStop(0,'#fff7dd');gr.addColorStop(.18,col);gr.addColorStop(1,col===TE?'#1c727f':'#a96c20');g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,7);g.fill();g.restore()}
function mesh(x,y,w,h,pore=.5){g.save();g.translate(x,y);g.transform(1,.04,-.35,.65,0,0);g.beginPath();g.rect(0,0,w,h);let sx=w/12,sy=h/7;for(let j=0;j<7;j++)for(let i=0;i<12;i++)g.rect(i*sx+sx*(1-pore)/2,j*sy+sy*(1-pore)/2,sx*pore,sy*pore);let gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#f1b777');gr.addColorStop(.5,'#b8733a');gr.addColorStop(1,'#e7ae70');g.fillStyle=gr;g.fill('evenodd');g.strokeStyle=CU;g.lineWidth=.6;g.stroke();g.restore()}
function separation(v,t){let oilPass=v.mode!=='water_pass',stay=oilPass?TE:AM,pass=oilPass?AM:TE,y=601;for(let i=0;i<12;i++){panel(89+i*46,y,31,24,CU,'#9e663f',2);for(let k=0;k<4;k++){g.fillStyle=CU;g.beginPath();g.arc(93+i*46+k*7,y-2,3,0,7);g.fill()}}droplet(217,y-51+Math.sin(t*2)*1.5,48,stay);droplet(315,y-28,26,stay);g.fillStyle=pass;g.globalAlpha*=.65;g.beginPath();g.ellipse(495,y-5,73,11,0,0,7);g.fill();g.globalAlpha/=.65;for(let i=0;i<3;i++){let u=(t*.55+i*.33)%1;alpha(Math.sin(u*Math.PI),()=>droplet(448+i*46,y+31+u*150,9,pass,1.35))}pill(v.labels?.[0]||(oilPass?'水留在上方':'油留在上方'),220,y-160,260,stay);pill(v.labels?.[1]||(oilPass?'油穿过网孔':'水穿过网孔'),490,y+228,260,pass);arrow(494,y+64,494,y+175,t,pass);fit(v.footer||'',360,945,29,IV,610,24)}
function material(v,t){mesh(161,449,470,250,.38+.12*Math.sin(t*.7));let u=(t*.2)%1,xx=165+u*400;g.shadowColor=TE;g.shadowBlur=17;line(xx-65,365,xx,470+((t*.4)%1)*120,TE,3);g.shadowBlur=0;pill(v.labels?.[0]||'通孔阵列',360,695,400);arrow(360,735,360,776,t);panel(102,801,516,116,AM,'rgba(240,166,64,.06)');for(let i=0;i<38;i++){let x=117+i*13,yy=853-rnd(i)*27;line(x,883,x,yy,CU,7);g.fillStyle=AM;g.beginPath();g.arc(x,yy-2,3,0,7);g.fill()}fit(v.labels?.[1]||'表面微纳米结构',360,954,28,IV,600,24)}
function coil(x,y,w,h,n=7){g.beginPath();for(let k=0;k<=n*40;k++){let a=k/(n*40)*n*2*Math.PI,xx=x+w*k/(n*40),yy=y+Math.sin(a)*h/2;k?g.lineTo(xx,yy):g.moveTo(xx,yy)}g.strokeStyle=AM;g.lineWidth=3;g.stroke()}
function thermal(v,t){if(v.mode==='hotspot'){panel(145,444,430,310,TE);for(let j=0;j<9;j++)for(let i=0;i<13;i++){let dx=i/12-(.57+.12*Math.sin(t*.8)),dy=j/8-(.45+.1*Math.cos(t*.9)),z=Math.exp(-(dx*dx*15+dy*dy*10));g.fillStyle=`rgb(${40+205*z},${119+35*z-75*z*z},${140-90*z})`;g.fillRect(159+i*31,459+j*31,29,29)}pill(v.labels?.[0]||'局部热点',360,841,300,RD);fit(v.footer||'',360,941,29,IV,610,23);return}panel(60,443,600,142,TE,'rgba(42,130,151,.12)');let r=.5-.5*Math.cos(t*.9),widths=[160+30*r,160-60*r,160+30*r],x=120;for(let w of widths){coil(x,514,w,66);x+=w}for(let i=0;i<24;i++){let u=(rnd(i)*600+t*100)%600;g.fillStyle=TE;g.beginPath();g.arc(60+u,514+(rnd(i+21)-.5)*70+Math.sin(u*.1+t*5)*r*7,2,0,7);g.fill()}fit(v.labels?.[0]||'局部响应',360,657,31,AM,600,24);arrow(360,710,360,772,t);pill(v.labels?.[1]||'调节散热',360,831,460);fit(v.footer||'',360,943,27,IV,610,23)}
function sensor(v,t){let y=488;panel(42,y-58,636,116,TE,'rgba(240,166,64,.06)');for(let i=0;i<32;i++){g.fillStyle=AM;g.beginPath();g.arc(48+(rnd(i)*624+t*100)%624,y+(rnd(i+20)-.5)*78,2+rnd(i)*3,0,7);g.fill()}panel(296,y-80,128,160,AM,'rgba(240,166,64,.1)');line(306,y-42,414,y-42,AM,6);line(306,y+42,414,y+42,AM,6);fit(v.labels?.[0]||'传感区域',360,603,27,AM,600,22);panel(60,672,600,208,TE);fit(v.labels?.[1]||'信号变化（示意）',360,707,25,MU,540,21);g.beginPath();for(let i=0;i<=250;i++){let a=t-6+i/250*6,u=(a%2.6+2.6)%2.6,z=Math.exp(-Math.pow((u-1.3)/.3,2)),x=84+i*2.2,yy=839-z*85;i?g.lineTo(x,yy):g.moveTo(x,yy)}g.strokeStyle=TE;g.lineWidth=3;g.stroke();fit(v.footer||'',360,949,29,IV,610,23)}
function imageScene(s,t){let im=IM[s.id];if(!im)return;let box={x:62,y:383,w:596,h:575},scale=Math.min(box.w/im.width,box.h/im.height)*(1+.02*Math.sin(t*.25));g.save();rr(box.x,box.y,box.w,box.h,18);g.clip();g.drawImage(im,360-im.width*scale/2,670-im.height*scale/2,im.width*scale,im.height*scale);g.restore()}
function cta(v,t){panel(56,382,608,247,AM,'rgba(240,166,64,.07)',22);let count=Math.ceil(measure(P.title,32)/550),step=Math.ceil(P.title.length/count),lines=P.closing_lines||[];if(!P.closing_lines)for(let at=0;at<P.title.length;at+=step)lines.push(P.title.slice(at,at+step));lines.slice(0,3).forEach((s,i)=>text(s,360,427+i*43,32,i===lines.length-1?AM:IV));text(P.identity.patent_number||'',360,557,23,MU,SANS,500);fit(P.maturity.label,360,599,23,MU,560,20,SANS);let con=P.contact;if(con){fit(con.label,360,715,30,IV,600,23,SANS);fit(con.phone||'',360,780,36,AM,610,25,SANS);fit(con.email||'',360,839,31,TE,610,23,SANS)}else{fit(P.audience,360,754,32,IV,600,24);fit('欢迎进一步了解技术',360,827,30,TE,600,23)}fit(v.footer||'欢迎进一步了解与洽谈',360,960,32,IV,610,24)}
const DRAW={flow,cards,compare,separation,material,thermal,sensor,cta,mri:(v,t)=>window.drawMRI(v,t),custom:(v,t)=>{if(typeof window.drawPatentCustom!=='function')throw Error('animation_script must define drawPatentCustom(visual, localTime)');window.drawPatentCustom(v,t)}};
function drawVisual(s,t){if(s.visual.type==='image')imageScene(s,t);else DRAW[s.visual.type](s.visual,t)}
function content(s,t){heading(s);drawVisual(s,t);if(s.visual.type!=='mri'&&(s.visual.type!=='cta'||s.visual.note))note(s.visual.note||'原理示意')}
function drawMechanismFrame(i,t){g.setTransform(1,0,0,1,0,0);g.fillStyle='#07131b';g.fillRect(0,0,1080,1920);g.setTransform(1.5,0,0,1.5,0,0);g.save();drawVisual(T.scenes[i],t);g.restore()}
function draw(t){t=cl(t,0,T.total-.001);g.setTransform(1.5,0,0,1.5,0,0);bg(t);let i=T.scenes.findIndex(s=>t>=s.start&&t<s.start+s.duration);if(i<0)i=T.scenes.length-1;let s=T.scenes[i],lt=t-s.start;alpha(Math.min(i?sm(lt,0,.4):1,1-sm(lt,s.duration-.35,s.duration)),()=>content(s,lt));identity();caption(s,lt);text(P.identity.patent_number||'',360,1173,17,'rgba(243,238,226,.42)',SANS,400);let n=T.scenes.length,w=576/n;for(let k=0;k<n;k++){rr(72+k*w,1213,w-10,3,1.5);g.fillStyle=k<i?AM:k===i?TE:'rgba(143,169,178,.24)';g.fill()}}
function drawCover(){g.setTransform(1.5,0,0,1.5,0,0);bg(2);identity();P.cover.headline.forEach((s,i)=>fit(s,360,255+i*87,70,i?AM:IV,635,46));let s=T.scenes.find(s=>s.id===P.cover.scene_id)||T.scenes.find(s=>s.visual.type===P.cover.visual);g.save();g.translate(108,320);g.scale(.7,.7);drawVisual(s,P.cover.time??3);g.restore();pill(P.maturity.label,360,1096,610,AM);panel(0,1171,720,80,AM,AM,0);fit('寻找合作企业 · 欢迎洽谈',360,1211,38,'#07131b',670,27);}
function audit(){let e=[];const check=(s,size,max,where)=>{if(measure(s,size)>max)e.push(where+': too wide at minimum font size')};for(let [i,s] of T.scenes.entries()){s.headline.forEach((h,j)=>check(h,j?28:32,620,`scene ${i+1} headline`));for(let cap of s.captions)if(wrap(cap.text,590,32).length>2)e.push(`scene ${i+1}: caption exceeds 2 lines`);for(let item of s.visual.items||[])check(item,23,455,`scene ${i+1} item`);for(let label of s.visual.labels||[])check(label,20,370,`scene ${i+1} label`)}if(wrap(P.title,550,32).length>3)e.push('CTA title too long');for(let h of P.closing_lines||[])check(h,32,550,'CTA title line');P.cover.headline.forEach(h=>check(h,46,635,'cover headline'));check(P.identity.institution+' · '+P.identity.patent_type,25,575,'identity');check(P.maturity.label,20,560,'maturity');return e;}
